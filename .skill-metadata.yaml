examples:
  - id: delegate-coding-task
    title:
      zh: 委派编码任务
      en: Delegate a Coding Task
    description:
      zh: 把开发、修复或重构任务整包交给 Qoder CN CLI，在一个项目目录里自主完成
      en: Hand a whole build, fix or refactor task to Qoder CN CLI inside one project directory
    prompt:
      zh: |-
        请用 Qoder CN CLI 完成这个任务：

        项目目录：{{项目路径}}
        任务描述：{{要做什么，例如给 API 调用补齐错误处理和超时}}

        要求：先读懂相关代码再动手，改完自行验证。把详细改动说明写入
        {{报告文件路径}}，最后只回复一行摘要（改了哪些文件、验证结果、消耗的 credits）。
      en: |-
        Complete this task with Qoder CN CLI:

        Project directory: {{project path}}
        Task: {{what to do, e.g. add error handling and timeouts to the API calls}}

        Read the relevant code before editing and verify afterwards. Write the detailed
        change notes to {{report file path}} and reply with only one summary line
        (files changed, verification result, credits consumed).

  - id: second-opinion-review
    title:
      zh: 交叉复审代码
      en: Cross-check Code Review
    description:
      zh: 让 Qoder CN CLI 以独立模型、独立账号复审，避免自己给自己背书
      en: Get an independent review from Qoder CN CLI, on a different model and account
    prompt:
      zh: |-
        让 Qoder CN CLI 复审这份代码，只要真正的缺陷，按严重程度排序：

        项目目录：{{项目路径}}
        复审范围：{{文件或目录，例如 src/ 或本次未提交改动}}
        关注点：{{例如正确性、并发、错误处理、安全}}

        要求只读不改，把逐条发现（含行号和修复建议）写入 {{审查报告路径}}，
        最后只回复严重问题数量和该文件路径。
      en: |-
        Have Qoder CN CLI review this code and report only real defects, ordered by
        severity:

        Project directory: {{project path}}
        Scope: {{files or directory, e.g. src/ or the current uncommitted diff}}
        Focus: {{e.g. correctness, concurrency, error handling, security}}

        Read only, change nothing. Write each finding (with line numbers and a suggested
        fix) to {{review report path}}, then reply with only the critical-issue count and
        that file path.

  - id: sdk-approved-run
    title:
      zh: 需中途授权的委派
      en: Delegation With Live Approval
    description:
      zh: 走官方 Agent SDK，敏感操作当场问我再决定
      en: Use the official Agent SDK so Qoder CN CLI asks me before risky operations
    prompt:
      zh: |-
        用 assets/ask_relay.py 走官方 Agent SDK 委派这个任务，不要预先放行工具：

        项目目录：{{项目路径}}
        任务描述：{{要做什么}}
        模型：{{默认 GLM-5.3-Flash，需要更强可填 Qwen3.8-Max}}

        遇到写文件之外的敏感操作（删文件、跑构建、访问网络、改动目录外路径）时
        停下来问我，由我答复放行或拒绝；完成后只汇报结果摘要和本次消耗的 credits。
      en: |-
        Delegate this task with assets/ask_relay.py over the official Agent SDK,
        without pre-approving tools:

        Project directory: {{project path}}
        Task: {{what to do}}
        Model: {{GLM-5.3-Flash by default, Qwen3.8-Max if you need stronger}}

        Pause and ask me before any sensitive operation other than ordinary file writes
        (deleting files, running builds, network access, touching paths outside the
        project). Report only a result summary and the credits consumed.

  - id: read-only-opinion
    title:
      zh: 只要第二意见
      en: Quick Read-only Opinion
    description:
      zh: 关掉全部工具、不落会话，最快最便宜地拿一个独立判断
      en: Fastest and cheapest independent judgement, with all tools disabled
    prompt:
      zh: |-
        让 Qoder CN CLI 给一个只读的第二意见（禁用所有工具，不写任何文件）：

        {{把要评估的代码、设计或方案贴在这里}}

        请指出最关键的风险和一个更简单的替代做法，控制在 200 字内。
      en: |-
        Get a read-only second opinion from Qoder CN CLI (all tools disabled, write
        nothing):

        {{paste the code, design or plan to evaluate here}}

        Name the most important risks and one simpler alternative, within 200 words.

  - id: diagnose-setup
    title:
      zh: 诊断调用环境
      en: Diagnose the Integration
    description:
      zh: 报 sdk_invalid_args、认证失败或模型不符时，按固定顺序定位
      en: Locate the cause when sdk_invalid_args, auth or model behaviour looks wrong
    prompt:
      zh: |-
        帮我诊断 Qoder CN CLI 的调用环境，按固定顺序逐项检查并说明每一项的实际读数：

        1. 清洗包装脚本能否拿到登录态（版本、用户名）
        2. 可用模型列表，以及当前默认模型对应的计费桶
        3. 一次最小 headless 调用是否成功
        4. 环境变量黑名单是否有误伤（重点看 PAT 和 QODERCN_MODEL 是否被保留）
        5. 若使用 SDK，是否已传 env 清洗和 auth

        我遇到的现象是：{{粘贴完整报错或异常表现}}
      en: |-
        Diagnose the Qoder CN CLI integration, checking each step in order and reporting
        the actual reading:

        1. Whether the scrubbing wrapper can reach the login state (version, username)
        2. Available models, and the billing bucket for the current default model
        3. Whether a minimal headless call succeeds
        4. Whether the denylist over-reaches, especially QODERCN_PERSONAL_ACCESS_TOKEN
           and QODERCN_MODEL still being preserved
        5. If the SDK is in use, whether env scrubbing and auth were both supplied

        What I am seeing: {{paste the full error or symptom}}
